AllCops:
  TargetRubyVersion: 3.0
  NewCops: disable
  SuggestExtensions: false

# Size metrics are tuned for applications. This repository keeps rubocop
# focused on style, layout and correctness instead of method size.
Metrics/AbcSize:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/ModuleLength:
  Enabled: false
Metrics/ParameterLists:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false

Style/FormatStringToken:
  Enabled: false

Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

Lint/StructNewOverride:
  Enabled: false

Style/Documentation:
  Enabled: true
  Exclude:
    - 'test/**/*'
    - 'bin/**/*'

Style/StringLiterals:
  EnforcedStyle: double_quotes
